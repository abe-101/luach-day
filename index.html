<!--
  luach.day — today's Hebrew date and the day's Hayom Yom entry,
  set like a two-color Israeli tear-off calendar leaf: ultramarine + red on white.
  Single self-contained static file. Host it anywhere. No build, no backend.

  Ideas arrive by email: the "Send idea" button opens the visitor's mail client
  addressed to IDEA_EMAIL below. Change it, or swap sendIdea() for a fetch().
-->

<!-- Structured data: helps search engines understand the page. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "https://luach.day/#website",
      "url": "https://luach.day/",
      "name": "luach.day",
      "description": "Today's Hebrew date — the day, month and year on the Jewish calendar."
    },
    {
      "@type": "FAQPage",
      "@id": "https://luach.day/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is a luach?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A luach is a Jewish calendar or almanac. At minimum it tells you the Hebrew date — the day, month and year — and traditionally also times like sunset and nightfall that mark when the Jewish day begins and ends."
          }
        },
        {
          "@type": "Question",
          "name": "What is today's Hebrew date?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "luach.day shows today's Hebrew date in your own time zone, computed in your browser from the Gregorian date. Open the page to see the current day, month and year on the Jewish calendar."
          }
        },
        {
          "@type": "Question",
          "name": "Why does the Hebrew date change at nightfall?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "On the Jewish calendar a new day begins at nightfall, not midnight. So after dark the Hebrew date advances to the next day even though the civil date has not."
          }
        },
        {
          "@type": "Question",
          "name": "What is Hayom Yom?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Hayom Yom is an anthology of Chassidic aphorisms and customs, one for each day of the Hebrew year, compiled by the Lubavitcher Rebbe. luach.day shows the entry for today's Hebrew date in the original Hebrew."
          }
        }
      ]
    }
  ]
}
</script>

<style>
  :root {
    --paper: #FDFDFA;
    --blue: #21409A;
    --blue-soft: #5B6FB5;
    --red: #CE2B23;
    --ink: #14181F;
    --tint: #EEF1F9;
    --rule: #BFC9E6;
    --frame-gap: clamp(10px, 2.5vw, 22px);
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Frank Ruhl Libre", Georgia, serif;
    padding: var(--frame-gap);
    -webkit-font-smoothing: antialiased;
  }

  /* The whole page is the printed sheet: double ultramarine frame. */
  .sheet {
    position: relative;
    min-height: calc(100vh - 2 * var(--frame-gap));
    border: 3px solid var(--blue);
    padding: clamp(18px, 4vw, 44px) clamp(16px, 5vw, 56px) clamp(26px, 4vw, 40px);
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
  }
  .sheet::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid var(--blue);
    pointer-events: none;
  }

  .strip {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--blue);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--blue);
  }
  .strip .site { color: var(--red); font-weight: 500; }

  .hebrew {
    direction: rtl;
    text-align: center;
    padding: clamp(24px, 5vw, 40px) 0 clamp(14px, 3vw, 22px);
  }

  .weekday-he {
    font-family: "Frank Ruhl Libre", Georgia, serif;
    font-size: clamp(19px, 4.5vw, 24px);
    font-weight: 500;
    color: var(--blue);
    margin: 0 0 2px;
  }

  /* Signature: off-register two-color print. Red impression, blue ghost. */
  .day-he {
    font-family: "Suez One", "Frank Ruhl Libre", serif;
    font-size: clamp(96px, 27vw, 176px);
    line-height: 1.05;
    margin: 0;
    color: var(--red);
    text-shadow: 0.035em 0.04em 0 rgba(33, 64, 154, 0.35);
  }

  .month-he {
    font-family: "Suez One", "Frank Ruhl Libre", serif;
    font-size: clamp(36px, 9.5vw, 58px);
    line-height: 1.2;
    margin: 0;
    color: var(--blue);
  }

  .year-he {
    direction: rtl;
    font-size: clamp(16px, 4vw, 19px);
    font-weight: 500;
    color: var(--ink);
    margin: 8px 0 0;
    letter-spacing: 0.06em;
  }

  .caption {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--blue-soft);
    text-align: center;
    letter-spacing: 0.04em;
    margin: 0 0 clamp(20px, 4vw, 30px);
  }

  /* Hayom Yom: a print box with its label riding the top border. */
  .hayomyom {
    position: relative;
    border: 1px solid var(--blue);
    background: var(--tint);
    margin-top: 14px;
    padding: clamp(24px, 5vw, 30px) clamp(16px, 4vw, 28px) clamp(18px, 4vw, 24px);
  }
  .hy-title {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translate(-50%, -50%);
    background: var(--paper);
    border: 1px solid var(--blue);
    font-family: "Suez One", "Frank Ruhl Libre", serif;
    font-size: clamp(15px, 3.8vw, 18px);
    font-weight: 400;
    color: var(--red);
    margin: 0;
    padding: 3px 16px;
    white-space: nowrap;
    direction: rtl;
  }
  .hy-text {
    font-size: clamp(16px, 4vw, 18px);
    line-height: 1.9;
    color: var(--ink);
    margin: 0;
    text-align: justify;
    text-justify: inter-word;
    white-space: pre-line;
  }

  .note {
    margin-top: auto;
    padding-top: clamp(24px, 5vw, 34px);
  }

  .ask {
    display: flex;
    gap: 0;
  }

  .ask input {
    flex: 1;
    min-width: 0;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 14px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--blue);
    border-right: none;
    border-radius: 0;
    padding: 12px 14px;
  }
  .ask input::placeholder { color: var(--blue-soft); }
  .ask input:focus {
    outline: none;
    box-shadow: inset 0 0 0 1px var(--blue);
  }

  .ask button {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--red);
    border: 1px solid var(--red);
    border-radius: 0;
    padding: 0 20px;
    cursor: pointer;
    white-space: nowrap;
  }
  .ask button:hover { background: #B02219; border-color: #B02219; }
  .ask button:active { transform: translateY(1px); }
  .ask button:focus-visible {
    outline: 3px solid rgba(206, 43, 35, 0.4);
    outline-offset: 2px;
  }

  .confirm {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--blue);
    text-align: center;
    margin: 12px 0 0;
    min-height: 1em;
  }

  @media (max-width: 420px) {
    .ask { flex-direction: column; gap: 8px; }
    .ask input { border-right: 1px solid var(--blue); }
    .ask button { padding: 12px; }
  }
</style>
</head>
<body>

<main class="sheet">
  <div class="strip">
    <span id="gy-date">—</span>
    <span class="site">luach.day</span>
  </div>

  <div class="hebrew" lang="he">
    <p class="weekday-he" id="he-weekday">&nbsp;</p>
    <div class="day-he" id="he-day">…</div>
    <p class="month-he" id="he-month">&nbsp;</p>
    <p class="year-he" id="he-year">&nbsp;</p>
  </div>

  <noscript>
    <p class="caption">Enable JavaScript to compute today's Hebrew date in your time zone.</p>
  </noscript>

  <section class="hayomyom" id="hy" lang="he" dir="rtl" hidden>
    <h2 class="hy-title">היום יום · <span id="hy-date"></span></h2>
    <p class="hy-text" id="hy-text"></p>
  </section>

  <div class="note">
    <div class="ask">
      <input id="idea" type="text" placeholder="an idea for luach.day…" aria-label="Your idea for luach.day">
      <button id="send" type="button">Send idea</button>
    </div>
    <p class="confirm" id="confirm" role="status"></p>
  </div>
</main>

<script>
  // Change this to your address, or replace sendIdea() with a fetch() to your endpoint.
  const IDEA_EMAIL = "ideas@luach.day";

  // Hebrew numerals by gematria: 5 -> ה׳, 15 -> ט״ו, 786 -> תשפ״ו.
  // Deterministic everywhere, unlike Intl's nu-hebr numbering system.
  function heNumeral(n) {
    const values = [
      [400, "ת"], [300, "ש"], [200, "ר"], [100, "ק"], [90, "צ"], [80, "פ"],
      [70, "ע"], [60, "ס"], [50, "נ"], [40, "מ"], [30, "ל"], [20, "כ"],
      [10, "י"], [9, "ט"], [8, "ח"], [7, "ז"], [6, "ו"], [5, "ה"],
      [4, "ד"], [3, "ג"], [2, "ב"], [1, "א"]
    ];
    if (!n) return "";
    let rest = n % 1000, s = ""; // years drop the thousands: 5786 -> תשפ"ו
    for (const [v, ch] of values) while (rest >= v) { s += ch; rest -= v; }
    s = s.replace(/יה$/, "טו").replace(/יו$/, "טז"); // avoid spelling the Name
    return s.length === 1 ? s + "׳" : s.slice(0, -1) + "״" + s.slice(-1);
  }

  (function renderDate() {
    const now = new Date();

    // Hebrew calendar, straight from Intl. No library needed.
    const heParts = new Intl.DateTimeFormat("he-u-ca-hebrew", {
      day: "numeric", month: "long", year: "numeric"
    }).formatToParts(now);
    const grab = t => {
      const part = heParts.find(p => p.type === t);
      return part ? part.value : "";
    };

    // Day and year arrive as digits in some browsers; convert via gematria.
    const heDay = heNumeral(parseInt(grab("day"), 10) || 0) || grab("day");
    const heMonth = grab("month");
    document.getElementById("he-day").textContent = heDay;
    document.getElementById("he-month").textContent = heMonth;
    document.getElementById("he-year").textContent =
      heNumeral(parseInt(grab("year"), 10) || 0) || grab("year");
    document.getElementById("he-weekday").textContent =
      new Intl.DateTimeFormat("he", { weekday: "long" }).format(now);
    document.getElementById("hy-date").textContent = `${heDay} ${heMonth}`;

    document.getElementById("gy-date").textContent =
      new Intl.DateTimeFormat("en-US", {
        weekday: "long", month: "short", day: "numeric", year: "numeric"
      }).format(now).replace(",", " ·");

    renderHayomYom(now);
  })();

  // Today's Hayom Yom — Hebrew text, keyed by Hebrew month+day (repeats yearly).
  // Data is a same-origin static file, so no CORS and no runtime dependency.
  async function renderHayomYom(now) {
    // Hebrew month name (English locale) -> data key. Tishri=1 … Elul=12; Adar II = "6b".
    const MONTH_KEY = {
      "Tishri": "1", "Heshvan": "2", "Kislev": "3", "Tevet": "4",
      "Shevat": "5", "Adar": "6", "Adar I": "6", "Adar II": "6b",
      "Nisan": "7", "Iyar": "8", "Sivan": "9", "Tamuz": "10",
      "Av": "11", "Elul": "12"
    };

    const parts = new Intl.DateTimeFormat("en-u-ca-hebrew", {
      month: "long", day: "numeric"
    }).formatToParts(now);
    const grab = t => (parts.find(p => p.type === t) || {}).value || "";
    const month = MONTH_KEY[grab("month")];
    const day = grab("day");
    if (!month || !day) return;
    const key = `${month}-${day}`;

    let data;
    try {
      const res = await fetch("hayomyom.json", { cache: "no-cache" });
      if (!res.ok) throw new Error("fetch failed");
      data = await res.json();
    } catch (e) {
      return; // leave section hidden; the Hebrew date still shows
    }

    const text = data[key];
    if (!text) return;

    document.getElementById("hy-text").textContent = text;
    document.getElementById("hy").hidden = false;
  }

  function sendIdea() {
    const input = document.getElementById("idea");
    const confirm = document.getElementById("confirm");
    const text = input.value.trim();
    if (!text) { input.focus(); return; }

    const subject = encodeURIComponent("idea for luach.day");
    const body = encodeURIComponent(text);
    window.location.href = `mailto:${IDEA_EMAIL}?subject=${subject}&body=${body}`;

    confirm.textContent = "opening your mail… thank you.";
    input.value = "";
  }

  document.getElementById("send").addEventListener("click", sendIdea);
  document.getElementById("idea").addEventListener("keydown", e => {
    if (e.key === "Enter") sendIdea();
  });
</script>
</body>
</html>
